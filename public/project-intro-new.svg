<svg width="300" height="155" viewBox="0 0 300 155" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07c160;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007aff;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="0" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="155" rx="12" fill="url(#grad)" />
  
  <!-- Abstract Connection Lines -->
  <g stroke="white" stroke-width="0.5" opacity="0.2">
    <line x1="20" y1="20" x2="100" y2="120" />
    <line x1="280" y1="30" x2="150" y2="140" />
    <circle cx="100" cy="120" r="2" fill="white" />
    <circle cx="150" cy="140" r="2" fill="white" />
    <circle cx="280" cy="30" r="2" fill="white" />
  </g>

  <!-- Main Title -->
  <text x="150" y="75" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle" filter="url(#shadow)">LocalSend</text>
  
  <!-- Subtitle -->
  <text x="150" y="105" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.9" text-anchor="middle">Real-time P2P &amp; Messaging</text>

  <!-- Tech Tags -->
  <g transform="translate(45, 125)">
    <!-- Tag 1: WebRTC -->
    <rect x="0" y="0" width="65" height="18" rx="9" fill="white" opacity="0.2" />
    <text x="32.5" y="13" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">WebRTC</text>
    
    <!-- Tag 2: Socket.IO -->
    <rect x="75" y="0" width="65" height="18" rx="9" fill="white" opacity="0.2" />
    <text x="107.5" y="13" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Socket.IO</text>
    
    <!-- Tag 3: Vue 3 -->
    <rect x="150" y="0" width="65" height="18" rx="9" fill="white" opacity="0.2" />
    <text x="182.5" y="13" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Vue 3</text>
  </g>
</svg>
